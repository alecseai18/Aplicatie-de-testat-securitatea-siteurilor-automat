services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scanner-worker:
    build: .
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      SCANNER_QUEUE: ctf.scan.jobs
      SCANNER_REPORT_DIR: /app/reports
    volumes:
      - ./reports:/app/reports
    command:
      - python
      - main.py
      - --worker
      - --rabbitmq-url
      - amqp://guest:guest@rabbitmq:5672/%2F
      - --report-dir
      - /app/reports
